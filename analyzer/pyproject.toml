[project]
name = "codemap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "userjp7", email = "jyotiprakashmahto7@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter",
    "tree-sitter-typescript",
    "networkx",
    "typer[all]",
    "rich",
    "watchdog",
    "pathspec",
    "pydantic",
    "fastapi",
    "uvicorn",
    "pytest>=9.0.3",
]

[project.scripts]
codemap = "codemap.cli:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.12",
]
